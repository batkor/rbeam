[package]
name = "rbeam"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.54", features = ["derive"] }
rand = "0.8.5"
spake2 = { version = "0.4", features = ["getrandom"] }
